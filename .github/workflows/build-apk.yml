name: Build APK

# Every push runs the end-to-end tests, then builds the Android app from the same web files and publishes it as the "latest" release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # All 7 journeys from the screens spec, in Chromium, offline (tiles, places and cities come from fixtures).
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: |
          python3 -m http.server 8788 --bind 127.0.0.1 > /dev/null 2>&1 &
          sleep 1
          set -o pipefail
          node tests/e2e.js 2>&1 | tee e2e.log || { grep -E "^FAIL|Error" e2e.log | head -30 | sed 's/^/::error::/'; exit 1; }
      - name: Keep test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: tests/out/*.png
          if-no-files-found: ignore

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Copy the web app into the APK
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html app.js cards.js ui.js core.js version.js manifest.webmanifest android/app/src/main/assets/
          cp -r icons vendor fonts c android/app/src/main/assets/

      # The key is never in this repo. Without the secrets the app is still built (to catch compile errors) but not published.
      - name: Write the signing key from secrets
        env:
          WANDER_KEYSTORE_BASE64: ${{ secrets.WANDER_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$WANDER_KEYSTORE_BASE64" ]; then
            echo "::warning::WANDER_KEYSTORE_BASE64 is not set: building unsigned to check the code, nothing will be published."
          else
            echo "$WANDER_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/wander.jks"
            echo "WANDER_KEYSTORE=$RUNNER_TEMP/wander.jks" >> "$GITHUB_ENV"
          fi

      - name: Build
        working-directory: android
        env:
          WANDER_KEYSTORE_PASSWORD: ${{ secrets.WANDER_KEYSTORE_PASSWORD }}
          WANDER_KEY_PASSWORD: ${{ secrets.WANDER_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon 2>&1 | tee ../gradle.log || { grep -E "^e: |error:|What went wrong|FAILED|Exception" -A2 ../gradle.log | head -40 | sed 's/^/::error::/'; exit 1; }

      # Stops an unsigned APK from being published, and logs the certificate for checking.
      - name: Check the APK is signed
        run: |
          if [ -z "$WANDER_KEYSTORE" ]; then
            echo "::error::Built and tested, but the signing secrets (WANDER_KEYSTORE_BASE64, WANDER_KEYSTORE_PASSWORD, WANDER_KEY_PASSWORD) are missing, so no APK is published."
            exit 1
          fi
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/release/app-release.apk

      - name: Publish latest APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Wander.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Wander.apk --title "Wander (latest)" \
            --notes "Download Wander.apk on your Android phone and tap it to install. Built from ${GITHUB_SHA::7}."
